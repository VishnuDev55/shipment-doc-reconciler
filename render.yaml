# Render blueprint — free tier, Docker, LIVE uploads with a hard daily cap.
#
# Requires a Render account. Push the repo to GitHub first, then in the Render
# dashboard choose "New > Blueprint" and point it at the repo; Render reads this
# file. Alternatively: `render.yaml` is honored by `render deploy` too.
#
# WHAT THIS INSTANCE IS
#   Live mode. A visitor's own upload is read by the vision model and costs real
#   money, so this file sets a money ceiling, an upload cap and a retention
#   window. The three bundled sample shipments do NOT depend on any of that: they
#   replay captured model output from the committed cache on every deployment
#   mode, make zero API calls, and keep working when the cap is spent.
#
# THREE SETTINGS DO THE SAFETY WORK
#   USD_DAILY_CAP=2.00        hard ceiling per UTC day, enforced from the ledger
#                             at RUNS_DIR/spend_log.json. At the cap, uploads get
#                             a 429 that names the number; samples keep working.
#                             Roughly a thousand documents at the measured
#                             per-document cost.
#   MAX_DOCUMENTS=3           a shipment of four or more files is refused (400)
#   MAX_PAGES_PER_DOCUMENT=4  a longer document is refused (400) rather than
#                             read in part, because a partial read costs a vision
#                             call and can produce a confident verdict about pages
#                             nobody looked at. Set REJECT_OVERSIZE_PAGES=false to
#                             truncate instead -- the report then discloses how
#                             many pages were not read.
#   RUN_TTL_HOURS=24          uploaded runs are deleted at startup once a day old.
#
# THE FREE TIER HAS NO PERSISTENT DISK
#   RUNS_DIR points at /tmp, so uploaded documents, their reports AND the spend
#   ledger are lost on redeploy or restart. That means the daily cap resets with
#   the instance. It is stated on the page ("deleted after 24 h ... lost when this
#   instance redeploys") rather than only here. If you need more than that, attach
#   a disk (paid) and point RUNS_DIR at it; the cap then accumulates across
#   restarts, and the retention notice reads the same RUN_TTL_HOURS.
#
# TWO THINGS FROM RENDER'S OWN DOCS THAT STILL MATTER
#  1. Render warns it "may suspend a Free web service that initiates an uncommonly
#     high volume of traffic over the public internet", listing "invoking external
#     APIs" as an example. A live demo calls NVIDIA + Nebius on every upload. The
#     cap bounds the money, not the request volume; if you expect a busy URL, lower
#     MAX_DOCUMENTS or keep DEMO_MODE=true.
#  2. Free services spin down after 15 min idle and take ~60s to wake, showing
#     Render's loading page. Cold-start the URL shortly before judging.
#
# Whether `runtime: docker` is permitted on the Free plan is NOT confirmed by
# Render's free-tier page (it lists Web Service as free-eligible, and Docker is
# a runtime rather than a service type). If Blueprint creation rejects it, fall
# back to Native Python: build.command = "pip install -r requirements.txt",
# start.command = "uvicorn app.main:app --host 0.0.0.0 --port $PORT". The app
# reads PORT from the environment via that command, so no code change is needed.

services:
  - type: web
    name: shipment-doc-reconciler
    runtime: docker
    plan: free
    region: oregon # any free region; change to whichever is closest to you
    dockerfilePath: ./Dockerfile
    # Open on purpose: a load balancer polls it every few seconds, and the route
    # makes no provider call, so it answers 200 whether or not a key is set.
    healthCheckPath: /api/health
    envVars:
      - key: DEMO_MODE
        value: "false" # live uploads; the three samples replay from cache regardless
      - key: USD_DAILY_CAP
        value: "2.00"
      - key: MAX_DOCUMENTS
        value: "3"
      - key: MAX_PAGES_PER_DOCUMENT
        value: "4"
      - key: REJECT_OVERSIZE_PAGES
        value: "true"
      - key: RUN_TTL_HOURS
        value: "24"
      - key: RUNS_DIR
        value: /tmp/shipment-runs # ephemeral on free tier, by design
      - key: CACHE_DIR
        value: /app/fixtures/responses # baked into the image; samples read this
      - key: ENABLE_SUMMARY
        value: "true"
      # Goods lines (which row disagrees, and arithmetic inside one invoice) need
      # one more vision call per document. Measured from the committed run
      # records on 2026-10-26, not estimated: on the omni model this file
      # deploys it adds ~23,700 tokens per document (about 4x the scalar read)
      # and 50-110 s of wall clock, cutting the $2 cap from ~1,000 documents to
      # ~400. Off for that reason. On Nemotron-3.5-Super-VL the same read costs
      # ~$0.0013 per document and a couple of seconds -- merge the two lines
      # below in if you switch VISION_PROVIDER to nebius. See docs/FEATURES.md.
      # - key: ENABLE_LINE_ITEMS
      #   value: "true"
      # The UI's Configure panel writes to the shared process, so on a public
      # URL one visitor's key would serve everyone else's runs. Off here; keys
      # come from the dashboard secrets below instead.
      - key: GUI_CONFIG_ENABLED
        value: "false"
      - key: VISION_PROVIDER
        value: nvidia
      # --- SET THESE IN THE RENDER DASHBOARD (secret values). Do NOT commit keys.
      # --- Without them the samples still work; uploads fail with a clear
      # --- "no vision key" error instead of spending anything.
      - key: NVIDIA_API_KEY
        sync: false
      - key: NEBIUS_API_KEY
        sync: false
      # This instance is open, and says so. A blank API_KEYS makes every route
      # -- including /page/, which reads files out of the run directory --
      # answer to anybody who finds the URL, so the app refuses to boot that way
      # unless the deployment admits it is intended. This one is a public demo:
      # the daily cap is the money guard, run ids are random and their files are
      # deleted after RUN_TTL_HOURS, and the three bundled samples cost nothing.
      # Do not put real commercial documents on it.
      #
      # To key it instead: generate a key with
      #   python -c "import secrets; print(secrets.token_urlsafe(24))"
      # paste it into the dashboard's API_KEYS secret, and delete the
      # ALLOW_OPEN_LIVE_DEPLOY entry below. The app then gates every data route
      # -- the bundled samples included -- to whoever holds the key.
      - key: API_KEYS
        sync: false
      - key: ALLOW_OPEN_LIVE_DEPLOY
        value: "1"
      # /api/config never returns a key in full, but with a blank CONFIG_TOKEN it
      # does return the first five and last four characters of each one to
      # whoever holds an API key -- enough, on a shared key, to make a real guess
      # about a key that leaked elsewhere. The token puts a second secret in
      # front of that read. GUI_CONFIG_ENABLED is "false" here so the panel that
      # writes config is already closed; this is about the read, not the write.
      - key: CONFIG_TOKEN
        sync: false
