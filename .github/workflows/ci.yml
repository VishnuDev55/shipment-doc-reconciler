name: CI

# The test suite makes zero network calls, enforced rather than documented:
# tests/conftest.py refuses every non-loopback socket for the session, and
# tests/test_offline_guard.py fails if that wall stops standing. A CI job here
# therefore cannot spend a provider key even if a secret were present.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the container runtime (Dockerfile: FROM python:3.11-slim) and
        # the interpreter the suite was validated on (3.11.15). 3.12 is the one
        # above it.
        #
        # 3.10 is deliberately NOT in this matrix even though it is the "other
        # side": the pinned runtime file cannot install there. Measured, not
        # assumed -- rapidfuzz 3.14.6's metadata declares Requires-Python
        # >=3.11, which is also why pyproject.toml says requires-python = ">=3.11".
        # Adding "3.10" would fail at the install step, not the test step.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev extras (pinned requirements-dev.txt = runtime + tools)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: "Install sanity check -- the runtime file alone must not pull in test tooling (AUDIT R8)"
        # Proves the split is real: in a throwaway venv built from
        # requirements.txt only, no pytest/pyflakes/ruff/mypy/coverage may exist,
        # and every app module must still import.
        run: |
          set -euo pipefail
          python -m venv .venv-runtime-only
          .venv-runtime-only/bin/python -m pip install -q -r requirements.txt
          if .venv-runtime-only/bin/python -m pip freeze | grep -qiE '^(pytest|pyflakes|ruff|mypy|coverage|pre.commit)[=!]'; then
            echo "FAIL: requirements.txt installed dev/test tooling"
            .venv-runtime-only/bin/python -m pip freeze
            exit 1
          fi
          echo "requirements.txt graph: $(.venv-runtime-only/bin/python -m pip freeze | grep -c '==') packages, no dev tooling"
          .venv-runtime-only/bin/python -m pip check
          DEMO_MODE=true RUNS_DIR=/tmp/ci-runs .venv-runtime-only/bin/python -c "import app.main, app.discovery, app.pdf; print('runtime-only import OK')"

      - name: "Lint (pyflakes) -- BLOCKING, measured 0 findings"
        # Blocking, and it earns that: measured clean on app/ scripts/ tests/
        # fixtures/. (For ~13 minutes mid-build this reported 3 findings in
        # scripts/evaluate.py; they were fixed, so the gate stayed hard instead
        # of being downgraded to a warning. Scope note: `make lint` covers
        # "app scripts tests"; CI is stricter and adds fixtures/.)
        run: python -m pyflakes app scripts tests tests_e2e fixtures

      - name: Lint (ruff) -- BLOCKING, measured 0 findings
        # Same explicit scope as `make ruff`: first-party directories plus
        # pyproject.toml itself, so an ad-hoc scratch .py at the repo root can
        # neither redden this gate nor be quietly excluded from it.
        run: python -m ruff check app scripts tests tests_e2e fixtures pyproject.toml

      - name: "Type check (mypy) -- BASELINE NOT ZERO: 36 errors in 9 files; NOT a pass"
        # Non-strict and non-blocking on purpose: the number is the baseline to
        # drive down, and making it red would mean either mass-editing app/ or
        # silencing rules to fake a green. Categories: arg-type 10, operator 9,
        # assignment 9, union-attr 3, call-overload 3, no-redef 1, attr-defined 1.
        continue-on-error: true
        run: python -m mypy app

      - name: Test (zero network calls by construction)
        run: python -m pytest tests/ -q

  coverage:
    # The floor is only here because it was measured first: 90% of app/ (see
    # pyproject.toml [tool.coverage]). fail_under = 88 sits BELOW that on
    # purpose, so this job catches regressions without being fiction.
    # Runs the suite a second time on 3.11 only, which is why it is its own job
    # rather than an extra step in every matrix cell.
    name: Coverage floor (app/, 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Measure and enforce the floor
        run: |
          python -m coverage run -m pytest tests/ -q
          python -m coverage report

      - name: Machine-readable total (for the trend, not for the gate)
        if: always()
        run: python -m coverage report --format=total

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage
          if-no-files-found: warn

  browser:
    # The UI is built from textContent in a 1,500-line script with no framework
    # and no build step, so the only way to know it still renders is to render it.
    # Separate job, separate directory, separate guarantee: these tests open real
    # sockets to a real uvicorn, which is exactly what tests/ forbids.
    name: Browser tests (chromium, DEMO_MODE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev extras (includes playwright)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install the chromium build this playwright version drives
        # --with-deps because ubuntu-latest has no browser system libraries by
        # default. Without this step the suite fails at launch, loudly, which is
        # the intended behaviour: a silently skipped UI test is worse than none.
        run: python -m playwright install --with-deps chromium

      - name: Run them
        run: python -m pytest tests_e2e -q -p no:cacheprovider

      - name: Keep the server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-server-logs
          path: |
            test-results/
            pytest-of-*/**/e2e-*/server.log
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t shipment-doc-reconciler .

      - name: Start it and check the endpoints
        # DEMO_MODE so the container needs no key. Asserts the health payload,
        # a fixture run end to end, and that Configure never emits key material.
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 8000:8000 \
            -e DEMO_MODE=true shipment-doc-reconciler
          for i in $(seq 1 30); do
            curl -sf localhost:8000/api/health >/dev/null && break
            sleep 2
            [ "$i" = 30 ] && { docker logs smoke; exit 1; }
          done
          curl -sf localhost:8000/api/health | grep -q '"status":"ok"'
          curl -sf localhost:8000/api/fixture/shipment_conflict \
            | grep -q '"shipment_id"'
          curl -sf localhost:8000/api/config | grep -q '"editable"'
          # The image declares a HEALTHCHECK; give it one interval to report.
          sleep 35
          status=$(docker inspect --format '{{.State.Health.Status}}' smoke)
          echo "container health: $status"
          [ "$status" = "healthy" ]

      - name: Leave no container behind
        if: always()
        run: docker rm -f smoke || true
