<rect x="1170" y="1088" width="406" height="150" rx="10" fill="#fbfdff" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="5 4"/><text x="1188" y="1118" font-size="15" font-weight="600" fill="#0f172a">One container, two configs</text><text x="1188" y="1140" font-size="12.6" fill="#475569" font-weight="400"><tspan x="1188" dy="0">Dockerfile → Render blueprint</tspan><tspan x="1188" dy="16.6">intentionally open demo, $2/day cap, 24 h TTL</tspan><tspan x="1188" dy="16.6">or docker compose · CI gates: lint,</tspan><tspan x="1188" dy="16.6">pytest, chromium e2e, docker smoke</tspan></text>
<text x="40" y="1270" font-size="11.8" fill="#475569">Left rail, outer to inner: the API reads report.json and serves pages/ and raw/ for every request; the pipeline writes report.json as each document settles.</text>
<text x="40" y="1290" font-size="11.8" fill="#475569">Retry, spend and cache detail: docs/ARCHITECTURE.md and docs/architecture-model/architecture-summary.md.</text>
