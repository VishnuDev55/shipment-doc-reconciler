<rect x="298" y="146" width="300" height="94" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/><text x="316" y="176" font-size="15" font-weight="600" fill="#0f172a">UI shell</text><text x="316" y="198" font-size="12.6" fill="#475569" font-weight="400"><tspan x="316" dy="0">web/index.html · app.js · app.css</tspan><tspan x="316" dy="16.6">vanilla JS, no build step</tspan></text>
<rect x="622" y="146" width="330" height="94" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/><text x="640" y="176" font-size="15" font-weight="600" fill="#0f172a">Report transport</text><text x="640" y="198" font-size="12.6" fill="#475569" font-weight="400"><tspan x="640" dy="0">polls /report at 1 Hz · SSE /events</tspan><tspan x="640" dy="16.6">HttpOnly session cookie</tspan></text>
<rect x="976" y="146" width="600" height="94" rx="10" fill="#fbfdff" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="5 4"/><text x="994" y="176" font-size="15" font-weight="600" fill="#0f172a">Why poll a file instead of holding a socket</text><text x="994" y="198" font-size="12.6" fill="#475569" font-weight="400"><tspan x="994" dy="0">report.json is the only settled artifact, so a closed tab</tspan><tspan x="994" dy="16.6">costs a poll and nothing else; the run is held server-side.</tspan></text>
<rect x="64" y="312" width="1512" height="76" rx="10" fill="#eef4ff" stroke="#3b6fb6" stroke-width="1.3"/><text x="82" y="342" font-size="15" font-weight="600" fill="#0f172a">Routes — 22 endpoints; every data-bearing one needs the key</text><text x="82" y="364" font-size="12.6" fill="#475569" font-weight="400"><tspan x="82" dy="0">upload · report · retry · correct · corrections · raw · events (SSE) · export ZIP · report.pdf · page · fixtures · config · models — open: /api/health, /api/session</tspan></text>
<rect x="64" y="404" width="240" height="100" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/><text x="82" y="434" font-size="15" font-weight="600" fill="#0f172a">Auth</text><text x="82" y="456" font-size="12.6" fill="#475569" font-weight="400"><tspan x="82" dy="0">X-API-Key / Bearer,</tspan><tspan x="82" dy="16.6">or session cookie</tspan></text>
<rect x="320" y="404" width="240" height="100" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/><text x="338" y="434" font-size="15" font-weight="600" fill="#0f172a">Rate limiter</text><text x="338" y="456" font-size="12.6" fill="#475569" font-weight="400"><tspan x="338" dy="0">sliding window,</tspan><tspan x="338" dy="16.6">per client identity</tspan></text>
<rect x="576" y="404" width="240" height="100" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/><text x="594" y="434" font-size="15" font-weight="600" fill="#0f172a">Spend gate</text><text x="594" y="456" font-size="12.6" fill="#475569" font-weight="400"><tspan x="594" dy="0">daily cap + projected</tspan><tspan x="594" dy="16.6">reservations</tspan></text>
